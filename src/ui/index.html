<style>
#top { position: absolute; left: 48px; right: 56px; top: 30px; height: 48px; }
#me { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; font-size: 17px; text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
#av { width: 46px; height: 46px; border-radius: 50%; background: #e0793a; position: relative; }
#av:after { content: ""; position: absolute; left: 15px; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: #1b3a5a; }
#tb { position: absolute; left: 50%; top: 0; transform: translateX(-50%); display: flex; gap: 16px; }
.tb { width: 46px; height: 46px; border-radius: 50%; background: var(--tb); display: grid; place-items: center; color: #cfe6ff; transition: box-shadow .2s, transform .2s; }
.tb .pic { width: 30px; height: 30px; }
.tb.f { transform: scale(1.15); box-shadow: 0 0 0 2px var(--accent), 0 0 0 7px rgba(var(--accent-glow), .16), 0 0 24px 10px rgba(var(--accent-glow), .2); }
#status { position: absolute; right: 0; top: 8px; display: flex; align-items: center; gap: 14px; font-size: 19px; color: #dce6f0; text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
#net { color: #cfe6ff; display: flex; }
#net.off { color: #e0443e; }
.rowglow { position: absolute; left: 30px; right: 30px; top: 322px; height: 210px; background: radial-gradient(60% 100% at 50% 50%, rgba(95, 184, 255, .14), rgba(95, 184, 255, 0)); filter: blur(14px); pointer-events: none; }
.row { position: absolute; display: flex; }
#r1 { left: 60px; top: 338px; align-items: flex-end; gap: 13px; transition: transform .25s ease; }
#r2 { left: 56px; right: 38px; top: 532px; gap: 30px; }
.t { position: relative; border-radius: 6px; overflow: hidden; cursor: pointer; transition: box-shadow .2s ease, transform .2s ease; }
.t1.f { transform: scale(1.1); }
.t1.big.f { transform: scale(1.05); }
.t2.f { transform: scale(1.04); }
.t1 { width: 108px; height: 106px; }
.t1.big { width: 180px; height: 178px; }
.t1 .g { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, .92); font-size: 34px; font-weight: 700; }
.t1 .g .ic { width: 40px; height: 40px; }
.t1 .g .appimg { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .35)); }
.t1.big .g .appimg { width: 104px; height: 104px; }
.t1.big .g .ic { width: 58px; height: 58px; }
.t1 b { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; font-weight: 600; font-size: 15px; background: rgba(8, 14, 22, .78); display: none; }
.t1.big b { display: block; }
.t1 .soon { position: absolute; top: 7px; right: 7px; font-size: 11px; font-weight: 600; background: rgba(8, 14, 22, .8); color: var(--ink-2); padding: 2px 7px; border-radius: 8px; }
.t1 .soon.get { background: var(--accent); color: var(--accent-ink); }
.t1.soonish .g { opacity: .5; }
.t1.run::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 20px; height: 4px; margin-left: -10px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px 1px rgba(var(--accent-glow), .9); }
.t1.big.run::after { left: 12px; top: 12px; bottom: auto; margin: 0; }
.t1.mv { transform: translateY(-16px) scale(1.08) !important; box-shadow: 0 0 0 3px #fff, 0 0 0 9px rgba(255, 255, 255, .14), 0 16px 34px rgba(0, 0, 0, .55); z-index: 4; }
#cap.moving { color: #fff; }
#hx[hidden] { display: none; }
.meterbar { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin: 6px 0 10px; }
.meterbar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .4s; }
.pnote { font-size: 14px !important; color: var(--ink-2); margin: 0 0 14px !important; }
label.pw { display: flex; gap: 8px; margin-bottom: 14px; }
label.pw input { flex: 1; font-size: 17px; padding: 11px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); outline: none; }
label.pw input:focus { border-color: var(--accent); }
label.pw button { padding: 0 14px; border-radius: 10px; background: var(--chip); font-size: 14px; }
.probadge { display: inline-block; margin-left: 10px; padding: 2px 8px; border-radius: 9px; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: #1a1406; background: linear-gradient(180deg, #ffe08a, #e0a52e); vertical-align: 2px; text-shadow: none; }
#av.pro { box-shadow: 0 0 0 3px #e6b84a, 0 0 16px 2px rgba(230, 184, 74, .45); }
.feats { margin: 0 0 14px; padding: 0; list-style: none; font-size: 15px; color: var(--ink-2); display: grid; gap: 6px; }
.feats li { display: flex; gap: 10px; align-items: center; }
.feats li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #e6b84a; flex: none; }
.buy { display: flex; gap: 16px; align-items: center; margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
.buy .qr { width: 104px; height: 104px; border-radius: 10px; background: #fff; padding: 6px; flex: none; }
.buy .qr svg { width: 100%; height: 100%; display: block; }
.t2 { flex: 1; height: 146px; color: #fff; }
.t2 .g { position: absolute; right: 16px; top: 14px; color: rgba(255, 255, 255, .7); }
.t2 .g .ic { width: 34px; height: 34px; }
.t2 .g .pic { width: 44px; height: 44px; }
.t2 b { position: absolute; left: 16px; bottom: 14px; font-weight: 600; font-size: 19px; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.t2 small { position: absolute; left: 16px; bottom: 40px; font-size: 13px; color: rgba(255, 255, 255, .78); }
#cap { position: absolute; left: 60px; top: 304px; font-size: 19px; font-weight: 600; text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
#hints { position: absolute; right: 44px; bottom: 8px; z-index: 4; }
#guide { position: absolute; left: 0; top: 0; bottom: 0; width: 420px; background: var(--panel); border-right: 1px solid var(--line); transform: translateX(-112%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); padding: 28px 26px; box-shadow: 0 0 0 8px rgba(95, 184, 255, .05), 0 0 0 18px rgba(95, 184, 255, .04), 0 0 60px 20px rgba(95, 184, 255, .08); z-index: 6; }
#guide.on { transform: none; }
#gtabs { display: flex; gap: 12px; margin: 22px 0 20px; }
.gt { width: 42px; height: 42px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; color: #cfe6ff; }
.gt.on { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px rgba(var(--accent-glow), .14), 0 0 0 13px rgba(var(--accent-glow), .06); }
.gt .ic { width: 20px; height: 20px; }
#gh { font-size: 22px; font-weight: 600; margin: 0 0 14px; }
#guide { display: flex; flex-direction: column; }
/* lists scroll (wheel or focus) instead of running off the screen; padding keeps the focus ring visible */
#gl, #pl { position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 6px 8px; margin: -6px -8px; }
#gl { flex: 1; min-height: 0; }
#pl { max-height: 430px; }
#gl::-webkit-scrollbar, #pl::-webkit-scrollbar { display: none; }
#bye { position: absolute; inset: 0; background: #000; display: none; align-items: center; justify-content: center; font-size: 20px; color: var(--mute); z-index: 40; }
</style>
</head>
<body data-live>
<div id="wrap"><div id="stage">
<svg class="bgsvg" viewBox="0 0 1280 720" aria-hidden="true"><defs><path id="c" d="M-210 30 C-150 -110 120 -130 220 -10 C300 95 85 165 -50 130 C-170 100 -250 95 -210 30 Z" fill="none" stroke="#cfe6ff"/></defs><g transform="translate(420 210)"><use href="#c" transform="scale(.5)" opacity=".2" stroke-width="2"/><use href="#c" transform="scale(.8)" opacity=".17" stroke-width="1.3"/><use href="#c" transform="scale(1.15)" opacity=".14" stroke-width="1"/><use href="#c" transform="scale(1.6)" opacity=".12" stroke-width=".8"/><use href="#c" transform="scale(2.1)" opacity=".1" stroke-width=".6"/></g><g transform="translate(1040 190)"><use href="#c" transform="scale(.45)" opacity=".2" stroke-width="2"/><use href="#c" transform="scale(.8)" opacity=".16" stroke-width="1.2"/><use href="#c" transform="scale(1.2)" opacity=".13" stroke-width=".9"/><use href="#c" transform="scale(1.7)" opacity=".1" stroke-width=".7"/></g></svg>
<div class="rowglow"></div>
<div id="top"><button id="me" aria-label="Open menu"><span id="av"></span><span id="pname"></span></button><div id="tb"></div><div id="status"><span id="net" title="Network"></span><span id="clock"></span></div></div>
<div id="cap"></div>
<div class="row" id="r1"></div>
<div class="row" id="r2"></div>
<div id="hints" class="hints"><button id="ha"><u style="background:#3ddc6b">A</u>Select</button><button id="hb"><u style="background:#e0443e">B</u>Back</button><button id="hx" hidden><u style="background:#5fb8ff">X</u>Options</button><button id="hm"><u style="background:#cfe6ff">&#8801;</u>Menu</button></div>
<div class="dim" id="dim"></div>
<aside id="guide"><div style="font-size:17px;color:var(--mute)">Menu</div><div id="gtabs"></div><h2 id="gh"></h2><div id="gl"></div></aside>
<section class="panel" id="panel" aria-live="polite"><h2 id="ph"></h2><p id="pp"></p><div id="pbody"></div><div id="pl"></div></section>
<div id="bye"></div>
<div id="toast"></div>
</div></div>
<script src="los.js"></script>
<script src="settings.js"></script>
<script>
const { $, call, toast, icon, pic, appPic, esc } = LOS;
const st = $('#stage');
call('session_state').then(s => { if (s && s.signed_in === false) location.href = 'login.html'; });
try { sessionStorage.removeItem('launchos.return'); } catch (e) { /* no storage */ }   // (Home: nothing to come back to)
const TILE = 'linear-gradient(160deg,var(--tile1),var(--tile2))';

/* ---------- home tiles ---------- */
/* Web apps run in their own window. Going Home keeps them running; Ctrl+click a tile to end one. */
let running = {};   // app id -> task from the system
let noteOnReturn = '';   // shown when you come back to Home (Home's timers pause while an app covers it)
function backHome() {
  // Drop any message left over from opening the app. Instantly, not with the fade: animations
  // don't tick on Home until the next input after an app was on screen.
  const t = $('#toast'); t.style.transition = 'none'; t.classList.remove('on'); void t.offsetWidth; t.style.transition = '';
  if (noteOnReturn) { toast(noteOnReturn, 3600); noteOnReturn = ''; }
}
const web = (id, name, url) => () => openApp(id, name, url);
async function openApp(id, name, url) {
  toast((running[id] ? 'Back to ' : 'Opening ') + name);
  const r = await call('open_app', { id, name, url });
  if (r && r.ended) noteOnReturn = 'Ended ' + r.ended + ' to free up memory';
  refreshTasks();
}
/* LaunchOS's own apps open in windows of their own and stay open in the background: Home is
   never reloaded, so going back and forth is instant. */
const openPage = (page, hash) => { if (mode !== 'home') closeAll(); LOS.open(page, hash); };
const monitor = () => openPage('monitor');
const files = () => openPage('files');
const settings = () => openPage('settings');
const store = hash => () => openPage('store', hash ? encodeURIComponent(hash) : '');
async function terminal() {
  toast((running.terminal ? 'Back to ' : 'Opening ') + 'Terminal');
  const r = await call('open_terminal');
  if (r && r.error) toast(r.error, 3600);
  if (r && r.ended) noteOnReturn = 'Ended ' + r.ended + ' to free up memory';
  refreshTasks();
}
let storeApps = [];   // apps installed from the Store, shown on Home
async function loadStoreApps() {
  const list = await call('store_home');
  if (!Array.isArray(list)) return;
  const sig = JSON.stringify(list), old = JSON.stringify(storeApps);
  storeApps = list;
  if (sig !== old && mode === 'home') renderHome();
}
/* Steam, Discord, Spotify… : the apps LaunchOS offers, with their own icons and whether they're on this PC */
let appsList = [], storeJob = {}, jobTimer = null;
async function loadApps() {
  const r = await call('apps_info');
  if (!r || !Array.isArray(r.apps)) return;
  const sig = JSON.stringify([r.apps, r.job && [r.job.app, r.job.done, r.job.percent]]), old = JSON.stringify([appsList, storeJob && [storeJob.app, storeJob.done, storeJob.percent]]);
  appsList = r.apps; storeJob = r.job || {}; appsInfo = r;
  if (sig !== old && mode === 'home') renderHome();
  // while apps are installing, keep their tiles' progress fresh
  clearTimeout(jobTimer);
  if (storeJob.step && !storeJob.done) jobTimer = setTimeout(loadApps, 2000);
}
const installing = a => !!(a.flatpak && storeJob.step && !storeJob.done && String(storeJob.app || '').split(',').includes(a.flatpak));
const DEFAULT_APPS = ['steam', 'winprog'];
function shownApps() {
  const picked = LOS.prefs.appsPicked ? LOS.prefs.apps : DEFAULT_APPS;
  const hidden = Array.isArray(LOS.prefs.appsHidden) ? LOS.prefs.appsHidden : [];
  // apps you picked, plus installed ones (from the Store, say) unless you unticked them in Setup
  return appsList.filter(a => picked.includes(a.key) || (a.flatpak && a.installed && !hidden.includes(a.key)));
}
const appArt = a => a.key === 'winprog' ? 'wine' : a.key === 'steam' ? 'steam' : '';
const goSetup = hash => () => openPage('setup', hash || '');
function tiles() {
  const W = (id, name, url, extra) => Object.assign({ id, name, url, act: web(id, name, url) }, extra);
  const all = [
    W('browser', 'Browser', '', { bg: TILE, pic: 'browser' }),
    { id: 'setup', name: LOS.prefs.setupDone ? 'Setup' : 'Start here: Setup', bg: 'linear-gradient(160deg,#2f8a55,#185033)', pic: 'setup', act: goSetup() },
    { id: 'settings', name: 'Settings', bg: TILE, pic: 'settings', act: settings },
    // Steam, Discord, Spotify and the rest: real apps, installed from Flathub when you pick them in Setup
    ...shownApps().map(a => ({ id: a.key, name: a.name, bg: TILE, img: a.icon, pic: appArt(a), letter: a.name[0], outside: true, app: a,
      badge: installing(a) ? 'Installing ' + Math.max(0, Math.min(99, storeJob.percent || 0)) + '%' : a.flatpak && !a.installed ? 'Get' : '',
      act: a.key === 'winprog' ? () => running.winprog ? openExt('winprog', 'Windows program') : programsPanel() : () => openExt(a.key, a.name) })),
    { id: 'files', name: 'Files', bg: TILE, pic: 'files', act: files },
    { id: 'store', name: 'Store', bg: TILE, pic: 'store', act: store() },
    { id: 'terminal', name: 'Terminal', bg: TILE, pic: 'terminal', act: terminal },
    { id: 'monitor', name: 'System monitor', bg: TILE, pic: 'monitor', act: monitor },
    // apps you got from the Store
    ...storeApps.map(a => ({ id: 'app:' + a.id, name: a.name, bg: TILE, img: a.icon, letter: (a.name || '?')[0].toUpperCase(), outside: true, store: a.id,
      act: () => openExt('app:' + a.id, a.name) })),
  ];
  // your own order (Move in a tile's options), then anything new at the end
  const order = Array.isArray(LOS.prefs.order) ? LOS.prefs.order : [];
  const rank = t => { const i = order.indexOf(t.id); return i < 0 ? order.length + all.indexOf(t) : i; };
  const list = order.length ? all.slice().sort((a, b) => rank(a) - rank(b)) : all;
  if (!LOS.prefs.setupDone) list.unshift(...list.splice(list.findIndex(t => t.id === 'setup'), 1));   // setup stays first until it's done
  return list;
}
const T2 = [
  { name: 'Browse the web', sub: 'Start page', bg: 'linear-gradient(120deg,#123e66,#1f6fb0 60%,#2aa6a0)', pic: 'browser', app: 'browser', act: web('browser', 'Browser', '') },
  { name: 'Get apps', sub: 'Discord, Spotify, games and more', bg: 'linear-gradient(120deg,#1b3f7a,#2d7ff9)', pic: 'store', app: 'store', act: store() },
  { name: 'Customize your Home', sub: 'Colors and background', bg: '#0f2233', pic: 'look', act: goSetup('look') },
  { name: 'Test your controller', sub: 'Buttons and sticks', bg: '#0a0a0a', pic: 'controller', act: goSetup('controller') },
];
const TB = [['browser', 'Browser', web('browser', 'Browser', ''), 'browser'], ['setup', 'Setup', goSetup(), 'setup'], ['files', 'Files', files, 'files'], ['store', 'Store', store(), 'store'], ['monitor', 'System monitor', monitor, 'monitor'], ['controller', 'Devices', () => openG(2)], ['settings', 'Settings', settings, 'settings']];

let T1 = [], R = [], pos = { r: 1, c: 0 }, mode = 'home';
// come back to the tile you left from (monitor, setup, browser) instead of the first one
try { const p = JSON.parse(sessionStorage.getItem('launchos.pos') || 'null'); if (p && Number.isInteger(p.r) && Number.isInteger(p.c)) pos = p; } catch (e) { /* no storage */ }
function renderHome(keep) {
  if (!keep) T1 = tiles();
  $('#tb').innerHTML = TB.map(t => `<button class="tb" aria-label="${t[1]}">${pic(t[0])}</button>`).join('');
  $('#r1').innerHTML = T1.map((t, i) => `<div class="t t1${i === 0 ? ' big' : ''}" role="button" aria-label="${esc(t.name)}" style="background:${t.bg}"><span class="g">${t.img || t.pic ? appPic(t.img, t.pic, 'appimg') : t.glyph ? icon(t.glyph) : esc(t.letter)}</span>${t.badge ? `<span class="soon${t.badge === 'Get' ? ' get' : ''}">${esc(t.badge)}</span>` : ''}<b>${esc(t.name)}</b></div>`).join('');
  $('#r2').innerHTML = T2.map(t => `<div class="t t2" role="button" aria-label="${esc(t.name)}" style="background:${t.bg}"><span class="g">${pic(t.pic)}</span><small>${esc(t.sub)}</small><b>${esc(t.name)}</b></div>`).join('');
  R = [[...document.querySelectorAll('.tb')], [...document.querySelectorAll('.t1')], [...document.querySelectorAll('.t2')]];
  if (!R[pos.r] || !R[pos.r].length) pos = { r: 1, c: 0 };
  pos.c = Math.max(0, Math.min(pos.c, R[pos.r].length - 1));   // the app list may have changed
  R.forEach((row, r) => row.forEach((el, c) => {
    el.onclick = e => {
      if (mode === 'move') { dropMove(); return; }
      if (mode !== 'home') return;
      pos = { r, c }; foc();
      if (e.ctrlKey && appAt(r, c)) appOptions(); else act();   // Ctrl+click: options (end task, restart, move…)
    };
    el.oncontextmenu = e => { e.preventDefault(); if (mode !== 'home') return; pos = { r, c }; foc(); appOptions(); };
    el.onmousemove = () => { if (mode !== 'home' || !LOS.mouseRecent() || (pos.r === r && pos.c === c)) return; pos = { r, c }; foc(); };
  }));
  paintMe();
  paintRun();
  foc();
}
/* your name, color and (with Pro) the supporter badge, top left */
function paintMe() {
  $('#pname').innerHTML = esc(LOS.prefs.name) + (LOS.pro ? '<span class="probadge" title="LaunchOS Pro supporter">PRO</span>' : '');
  $('#av').style.background = LOS.prefs.avatar;
  $('#av').classList.toggle('pro', LOS.pro);
}
document.addEventListener('los:pro', () => paintMe());
document.addEventListener('los:back', () => paintMe());   // (back from another window: the name or picture may have changed)   // (Pro was turned on or off: the badge follows)
const NAMES = () => [TB.map(t => t[1]), T1.map(t => t.name), T2.map(t => t.name)];
function foc() {
  R.flat().forEach(e => e.classList.remove('f'));
  R[pos.r][pos.c].classList.add('f');
  try { sessionStorage.setItem('launchos.pos', JSON.stringify(pos)); } catch (e) { /* no storage */ }
  const t = T1[pos.c];
  $('#cap').classList.toggle('moving', mode === 'move');
  $('#cap').textContent = mode === 'move' ? 'Moving ' + t.name + ': left and right to move, A to drop, B to cancel'
    : (pos.r === 1 && pos.c > 0) ? NAMES()[1][pos.c] + (running[t.id] ? ' · Running' : '') : '';
  $('#hx').hidden = !(mode === 'home' && appAt(pos.r, pos.c));
  scrollRow();
}
/* The app row is wider than the screen: slide it so the selected tile is in view. */
let rowX = 0;
function scrollRow() {
  const row = $('#r1'); if (!R[1] || !R[1].length) return;
  if (pos.r !== 1) return;
  const el = R[1][pos.c], view = 1280 - 60 - 48;
  let x = rowX;
  const left = el.offsetLeft, right = left + el.offsetWidth;
  if (right - x > view) x = right - view + 10;
  if (left - x < 0) x = left === 0 ? 0 : left - 10;
  x = Math.max(0, Math.min(x, Math.max(0, row.scrollWidth - view)));
  if (x !== rowX) { rowX = x; row.style.transform = `translateX(${-x}px)`; }
}
function act() {
  const t = pos.r === 0 ? TB[pos.c] && { act: TB[pos.c][2] } : (pos.r === 1 ? T1 : T2)[pos.c];
  if (t) t.act();   // (nothing there yet: Home is still filling in its tiles)
}

/* ---------- outside apps: Steam, Roblox, FreeTube, Windows programs ---------- */
const GET_NOTES = { roblox: 'Roblox runs through Sober, a free app made for Linux.', freetube: 'FreeTube plays YouTube without ads or tracking.',
  minecraft: 'Prism Launcher runs Minecraft: Java Edition. Sign in with your Microsoft account.', heroic: 'Heroic plays your games from Epic Games, GOG and Amazon.' };
async function openExt(id, name, path, checked) {
  if (!appsList.length) await loadApps();
  const a = appsList.find(x => x.key === id);
  if (a && a.flatpak && !a.installed) { installing(a) ? progressPanel('store', 'Getting ' + a.name, () => { loadApps(); }) : getPanel(a); return; }
  if (!checked && !running[id] && (id === 'steam' || id === 'roblox')) {
    storage = storage || await call('storage');
    const notes = [];
    if (appsInfo.gpu === 'software') notes.push('This PC has no graphics acceleration here (VirtualBox works like this), so games will be slow or may not start. For games, start LaunchOS from a USB stick on your PC.');
    if (storage && !storage.saving) notes.push('Saving is off, so what ' + name + ' downloads is gone after you shut down. Turn on saving in Settings.');
    if (id === 'steam') notes.push('Steam is Valve’s own app (free, not open source). The first time, it downloads and updates itself, which takes a few minutes. Press Super or the Xbox button to come back to Home any time.');
    if (notes.length > (id === 'steam' ? 1 : 0)) {
      panel(name, notes.join(' '), [row('Open ' + name, '', 'play', () => { closePanel(); openExt(id, name, path, true); }), row('Cancel', '', 'check', () => closePanel())]);
      return;
    }
  }
  toast((running[id] ? 'Back to ' : 'Opening ') + name);
  const r = await call('open_ext', { id, path });
  if (r && r.error) {
    toast(name + ' couldn’t start', 3200);
  }
  refreshTasks();
}
function getPanel(a) {
  panel('Get ' + a.name, (GET_NOTES[a.key] ? GET_NOTES[a.key] + ' ' : '') + a.name + ' isn’t on this PC yet. It’s a one-time download from Flathub, the Linux app store.', [
    row('Download ' + a.name, 'Needs an internet connection', 'download', async () => {
      const r = await call('get_app', a.key);

}
async function programsPanel() {
  panel('Windows programs', 'Looking in Downloads and on USB drives…', [row('Cancel', '', 'check', () => closePanel())]);
  const myP = P;
  await call('mount_drives');
  await new Promise(r => setTimeout(r, 1500));
  const list = await call('win_programs');
  if (P !== myP) return;
  const kb = n => n > 1048576 ? Math.round(n / 1048576) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  const rows = (Array.isArray(list) ? list : []).map(p => row(p.name, p.where + ' · ' + kb(p.size), 'grid', () => { closePanel(); openExt('winprog', p.name, p.path, true); }));
  panel('Windows programs', rows.length ? 'Runs Windows programs (.exe) with Wine. Most installers and small games work; some programs don’t. The very first one takes a minute while Wine sets itself up.'

    rows.concat([row('Close', '', 'check', () => closePanel())]));
}

/* ---------- running apps and app options ---------- */
function setTasks(list) {
  const keep = mode === 'guide' ? (items()[g.i] || {}).t : null;
  running = {};
  (Array.isArray(list) ? list : []).forEach(t => { running[t.id] = t; });
  if (!R.length) return;   // home not drawn yet
  paintRun();
  if (mode === 'home') foc();
  else if (mode === 'guide') {   // running apps head the Home tab: keep the same row selected as it shifts
    const k = items().findIndex(o => o.t === keep);
    if (k >= 0) g.i = k;
    rg();
  }
}
async function refreshTasks() { setTasks(await call('tasks')); }
window.__losTasks = list => { setTasks(list); if (!list.some(t => t.shown)) backHome(); };   // the system sends the list whenever an app starts, goes to the background or ends
function paintRun() { (R[1] || []).forEach((el, c) => el.classList.toggle('run', !!(T1[c] && running[T1[c].id]))); }
function appAt(r, c) {
  const id = r === 1 ? (T1[c] || {}).id : r === 2 ? (T2[c] || {}).app : r === 0 ? (TB[c] || [])[3] : null;
  return id ? T1.find(t => t.id === id) || null : null;
}
const dur = s => s < 60 ? 'less than a minute' : s < 3600 ? Math.floor(s / 60) + ' min' : Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min';
async function appOptions() {

  let body = `<dl class="kv"><dt>Status</dt><dd>${t ? 'Running for ' + dur(t.running_s) : 'Not running'}</dd>`;
  if (t && t.title && t.title !== a.name) body += `<dt>Showing</dt><dd>${esc(t.title)}</dd>`;
  body += `<dt>Type</dt><dd>${kind}</dd></dl>`;
  const text = t ? 'Running in the background. End it to free up memory.'
    : a.outside ? 'Not running.' : a.url != null ? 'Not running. Opening it starts it fresh.' : 'Part of LaunchOS. It only runs while it’s open.';
  const rows = [];
  if (t) {
    rows.push(row('Resume', 'Go back to where you left off', 'play', () => { closePanel(); a.act(); }));
    rows.push(row('Restart', 'End it and open it fresh', 'refresh', async () => { closePanel(); await call('end_app', a.id); a.act(); }));
    rows.push(row('End task', 'Close it and free up memory', 'close', async () => {
      const r = await call('end_app', a.id); closePanel();
      toast(r && r.ok ? 'Ended ' + a.name : a.name + ' already stopped'); refreshTasks();
    }));
  } else {
    rows.push(row('Open', '', a.glyph || 'play', () => { closePanel(); a.act(); }));
  }
  if (canMove(a)) rows.push(row('Move', 'Change where it sits on Home', 'move', startMove));
  if (a.store) rows.push(row('Uninstall', 'Remove it in the Store', 'close', store(a.store)));
  rows.push(row('Cancel', '', 'check', () => closePanel()));
  panel(a.name, text, rows, { body });
}
/* Move: lift the tile, slide it with left/right, drop it with A (B cancels). */
let moveSaved = null;
const lockedFirst = () => !LOS.prefs.setupDone;   // until Setup is done its tile stays first
const canMove = a => T1.length > 1 && !(lockedFirst() && a.id === 'setup');
function startMove() {
  const a = appAt(pos.r, pos.c);
  closePanel(true); $('#dim').classList.remove('on');
  pos = { r: 1, c: T1.indexOf(a) };
  moveSaved = T1.map(t => t.id);
  mode = 'move'; drawMove();
}
function drawMove() { renderHome(true); R[1][pos.c].classList.add('mv'); }
function moveBy(d) {
  const c = pos.c, n = c + d, lo = lockedFirst() ? 1 : 0;
  if (n < lo || n >= T1.length) return;
  [T1[c], T1[n]] = [T1[n], T1[c]]; pos.c = n; drawMove();
}
function dropMove() { LOS.save({ order: T1.map(t => t.id) }); mode = 'home'; renderHome(); toast('Moved ' + T1[pos.c].name); }
function cancelMove() {
  const id = T1[pos.c].id;
  T1 = moveSaved.map(x => T1.find(t => t.id === x)); pos.c = T1.findIndex(t => t.id === id);
  mode = 'home'; renderHome(true);
}

/* ---------- live status: clock and network ---------- */
let inputs = [];   // (net, vol, info, zone: settings.js)
function tick() { $('#clock').textContent = LOS.clockText(); }
async function refreshNet() {
  net = await call('network');
  const el = $('#net');
  el.innerHTML = icon('wifi');
  el.classList.toggle('off', !(net && net.connected));
  el.title = net && net.connected ? 'Connected' : 'Not connected';
}

/* ---------- side menu ---------- */
const TABS = [['home', 'Home'], ['chat', 'Chat'], ['pad', 'Devices'], ['bell', 'Notifications'], ['gear', 'Settings']];
let g = { t: 0, i: 0 };
function items() {
  const ip = net && net.connected ? (net.links.find(l => l.ipv4.length) || {}).ipv4 : null;
  switch (g.t) {
    case 0: return [
      ...Object.values(running).map(t => { const tile = T1.find(x => x.id === t.id) || {};
        return row(t.outside ? t.title || t.name : t.name, 'Running · ' + dur(t.running_s), 'play', () => { closeAll(); t.page ? LOS.open(t.page) : t.outside ? openExt(t.id, t.name) : openApp(t.id, t.name, ''); }, { img: tile.img, pic: tile.pic || t.page }); }),
      row('Browser', 'Browse the web', 'globe', web('browser', 'Browser', ''), { pic: 'browser' }),
      row('Setup', LOS.prefs.setupDone ? 'Go through setup again' : 'Not finished yet', 'wand', goSetup(), { pic: 'setup' }),
      row('Customize your Home', 'Colors and background', 'palette', goSetup('look'), { pic: 'look' }),

      row('System monitor', 'CPU, memory, network and apps', 'chart', monitor, { pic: 'monitor' }),
      row('Reload home screen', 'Refresh this screen', 'refresh', () => location.reload()),
    ];
    case 1: { const d = appsList.find(a => a.key === 'discord') || { key: 'discord', name: 'Discord', flatpak: 'com.discordapp.Discord', icon: '' };
      return [
        row('Discord', d.installed ? 'The Discord app' : 'Get the Discord app', 'chat', () => { closeAll(); openExt('discord', 'Discord'); }, { img: d.icon }),
        row('Discord beside Home', 'The web version, in a panel. Super closes it.', 'chat', () => { closeAll(); call('discord_panel', { open: true }); }, { img: d.icon }),
        row('Discord status', 'Check if Discord is having problems', 'info', web('discordstatus', 'Discord status', 'https://discordstatus.com')),
      ]; }
    case 2: return [
      ...inputs.map(d => row(d.name, (d.kind === 'controller' ? 'Controller' : d.kind === 'mouse' ? 'Mouse or touchpad' : 'Keyboard') + (d.usb ? ', USB' : ''), 'pad', () => toast(d.name + ' is working'), { pic: d.kind === 'controller' ? 'controller' : d.kind === 'mouse' ? 'mouse' : 'keyboard' })),
      row('Detect new device', 'Plug it in, then select this', 'usb', detect),
      row('USB drives and disks', 'Open, eject or format them in Files', 'drive', files, { pic: 'drive' }),
      row('Test your controller', 'See every button and stick', 'pad', goSetup('controller'), { pic: 'controller' }),
    ];
    case 3: {
      const n = [];
      if (!LOS.prefs.setupDone) n.push(row('Finish setting up', 'Your name, time zone and apps', 'wand', goSetup(), { pic: 'setup' }));
      if (net && !net.connected) n.push(row('No network connection', 'Open Network settings', 'wifi', () => netPanel(), { pic: 'network' }));
      if (vol && vol.available && vol.muted) n.push(row('Sound is muted', 'Open Sound settings', 'sound', () => volPanel(), { pic: 'sound' }));
      if (storage && !storage.saving) n.push(row('Saving is off', 'Changes reset when you shut down', 'info', () => savingPanel(), { pic: 'saving' }));
      if (storeJob.step && !storeJob.done) n.push(row(storeJob.step, (storeJob.percent || 0) + '%', 'download', () => progressPanel('store', storeJob.name ? 'Getting ' + storeJob.name : 'Store', () => loadApps()), { pic: 'store' }));
      else if (storeJob.done && storeJob.error) n.push(row('An app didn’t install', storeJob.error, 'info', () => { closeAll(); store()(); }, { pic: 'store' }));
      return n;
    }
    case 4: return [
      row('All settings', 'Open the Settings app', 'gear', settings, { pic: 'settings' }),
      row('Screen size', LOS.SIZE_NAMES[LOS.prefs.size] || 'Fill screen', 'display', () => sizePanel(), { pic: 'display' }),
      row('Sound', vol ? (vol.available ? (vol.muted ? 'Muted' : 'Volume ' + vol.value + '%') : 'No sound device found') : 'Checking…', 'sound', () => volPanel(), { pic: 'sound' }),
      row('Network', net ? (net.connected ? 'Connected' + (ip ? ', ' + ip[0] : '') : 'Not connected') : 'Checking…', 'wifi', () => netPanel(), { pic: 'network' }),
      row('Wi-Fi', 'Find and join networks', 'wifi', () => wifiPanel(), { pic: 'wifi' }),
      row('Time zone', (LOS.prefs.timezone || zone || 'UTC').replace(/^Etc\//, '').replace(/_/g, ' '), 'clock', goSetup('timezone'), { pic: 'time' }),
      row('Name and colors', LOS.prefs.name, 'user', goSetup('name'), { pic: 'user' }),
      row('Apps on Home', 'Pick apps like Discord and Steam', 'grid', goSetup('apps'), { pic: 'games' }),
      row('Gaming', pro && pro.active ? 'Performance mode and FPS counter' : 'Gaming mode, with LaunchOS Pro', 'pad', () => gamingPanel(), { pic: 'controller' }),
      row('Password', adminSet ? (session && session.ask ? 'Set · asked at sign-in and for sudo' : 'Set · used for sudo') : 'Not set', 'user', () => adminPanel(), { pic: 'password' }),
      row('Saving', storage ? (storage.saving ? 'On' : 'Off · changes reset at shut down') : 'Checking…', 'usb', () => savingPanel(), { pic: 'saving' }),
      row('Drives', 'Open, eject or format drives in Files', 'drive', files, { pic: 'drive' }),
      ...(storage && storage.installed ? [] : [row('Install LaunchOS', 'Put it on a drive in this PC', 'usb', () => installPanel(), { pic: 'install' })]),
      row('System monitor', 'CPU, memory, network and apps', 'chart', monitor, { pic: 'monitor' }),
      row('Updates', 'LaunchOS, your apps and the system', 'refresh', () => updatesPanel(), { pic: 'updates' }),
      row('LaunchOS Pro', pro && pro.active ? 'On · thanks for supporting LaunchOS' : pro && pro.on_sale ? 'Extras for $5, once' : 'Coming soon', 'info', () => proPanel(), { pic: 'pro' }),
      row('About LaunchOS', info ? 'Version ' + info.version : 'Version', 'info', () => aboutPanel(), { img: '/opt/launcher/img/launchos-icon.png' }),
      row('Power', adminSet ? 'Lock, sign out, shut down or restart' : 'Sign out, shut down or restart', 'power', () => powerPanel(), { pic: 'power' }),

}
/* Scroll a list just enough to show its focused row. */
function keepVisible(list) {
  const f = list.querySelector('.f'); if (!f) return;
  const pad = 8;
  if (f.offsetTop - pad < list.scrollTop) list.scrollTop = f.offsetTop - pad;
  else if (f.offsetTop + f.offsetHeight + pad > list.scrollTop + list.clientHeight) list.scrollTop = f.offsetTop + f.offsetHeight + pad - list.clientHeight;
}
function rg() {
  $('#gtabs').innerHTML = TABS.map((t, k) => `<button class="gt${k === g.t ? ' on' : ''}" data-k="${k}" aria-label="${t[1]}">${icon(t[0])}</button>`).join('');
  $('#gh').textContent = TABS[g.t][1];
  const L = items();
  g.i = Math.min(g.i, L.length - 1);
  $('#gl').innerHTML = L.map((o, k) => `<div class="it${k === g.i ? ' f' : ''}" data-k="${k}">${rowIcon(o)}<span class="txt"><span>${esc(o.t)}</span><small>${esc(o.s)}</small></span></div>`).join('');
  keepVisible($('#gl'));
}
async function refreshAll() {
  call('pro_state').then(r => { if (r && !r.error) { pro = r; if (mode === 'guide') rg(); } });
  call('admin_set').then(r => { adminSet = !!(r && r.set); if (mode === 'guide') rg(); });
  call('session_state').then(r => { session = r; if (mode === 'guide') rg(); });
  loadApps();
  [vol, info, inputs, storage] = await Promise.all([call('volume_get'), call('info'), call('inputs'), call('storage'), refreshTasks()]);
  const z = await call('timezone_get'); zone = z && z.zone;
  await refreshNet();
  if (mode === 'guide') rg();
}
function openG(t) { mode = 'guide'; if (t != null) g = { t, i: 0 }; $('#guide').classList.add('on'); $('#dim').classList.add('on'); rg(); refreshAll(); }
function closeAll() { mode = 'home'; $('#guide').classList.remove('on'); $('#dim').classList.remove('on'); closePanel(true); }
function gact() { const o = items()[g.i]; if (o) o.a(); }
async function detect() {
  const before = inputs.map(d => d.name);
  toast('Looking for new devices…');
  await new Promise(r => setTimeout(r, 1200));
  inputs = await call('inputs');
  const fresh = inputs.filter(d => !before.includes(d.name));
  toast(fresh.length ? 'Found: ' + fresh.map(d => d.name).join(', ') : 'No new devices. Try another USB port or cable.', 3600);
  rg();
}

/* ---------- panels (pop-ups) ---------- */
let P = null;   // { rows:[], i, back }
function panel(title, text, rows, opts) {
  // a pop-up that replaces another one goes back to where the first one came from
  const from = mode === 'panel' && P ? P.from : mode;
  LOS.osk.hide();
  P = Object.assign({ rows, i: 0, from }, opts || {});
  mode = 'panel';
  $('#ph').textContent = title; $('#pp').textContent = text || '';
  $('#pbody').innerHTML = P.body || '';
  rp();
  $('#dim').classList.add('on'); $('#panel').classList.add('on');
}
function rp() {
  $('#pl').innerHTML = P.rows.map((o, k) => o.slider != null
    ? `<div class="slider${k === P.i ? ' f' : ''}" data-k="${k}" role="slider" aria-label="${esc(o.t || 'Volume')}" aria-valuenow="${o.slider}"><i style="width:${o.slider}%"></i><b style="left:${o.slider}%"></b></div>`
    : `<div class="it${k === P.i ? ' f' : ''}" data-k="${k}">${rowIcon(o)}<span class="txt"><span>${esc(o.t)}</span>${o.s ? `<small>${esc(o.s)}</small>` : ''}</span></div>`).join('');
  keepVisible($('#pl'));
}
function closePanel(silent) {
  $('#panel').classList.remove('on');
  LOS.osk.hide();   // (its Done must never act for a panel that's gone)
  dropInput();
  if (!P) return;
  const from = P.from; P = null;
  if (silent) return;
  mode = from === 'guide' ? 'guide' : 'home';
  if (mode === 'home') $('#dim').classList.remove('on'); else rg();
}
function pact(dir) {
  const o = P.rows[P.i];
  if (!o) return;   // a "please wait" panel has no choices yet
  if (dir && o.slider != null) { o.adjust(dir); return; }
  if (!dir && o.a) o.a();
}
/* ---------- navigation ---------- */
function mv(dx, dy) {
  if (mode === 'panel') {
    const o = P.rows[P.i];
    if (!o) return;
    if (dx && o.slider != null) { pact(dx); return; }
    if (dy) { P.i = Math.max(0, Math.min(P.rows.length - 1, P.i + dy)); rp(); }
    return;
  }
  if (mode === 'guide') {
    if (dx) { g.t = (g.t + dx + TABS.length) % TABS.length; g.i = 0; }
    if (dy) g.i = Math.max(0, Math.min(items().length - 1, g.i + dy));
    rg(); return;
  }
  if (mode !== 'home') return;
  const n = R[pos.r].length;
  if (dx) pos.c = Math.max(0, Math.min(n - 1, pos.c + dx));
  if (dy) { const r = Math.max(0, Math.min(2, pos.r + dy)); if (r !== pos.r) { pos.c = Math.round(pos.c * (R[r].length - 1) / (n - 1 || 1)); pos.r = r; } }
  foc();
}
function back() { if (mode === 'panel') closePanel(); else if (mode === 'guide') closeAll(); }
function menu() { if (mode === 'home') openG(); else closeAll(); }
function ok() { if (mode === 'home') act(); else if (mode === 'guide') gact(); else if (mode === 'panel') pact(); }
function nav(a, e) {
  // Enter in a panel's text box does the panel's main thing, unless another choice (like Cancel)
  // was picked with the arrows
  if (a === 'ok' && e && e.target && e.target.tagName === 'INPUT' && mode === 'panel' && P && P.enter) {
    const o = P.rows[P.i];
    if (o && !o.typing && o.a !== P.enter) { o.a(); return; }
    P.enter(); return;
  }
  if (mode === 'move') { const f = { left: () => moveBy(-1), right: () => moveBy(1), ok: dropMove, back: cancelMove, menu: cancelMove, guide: cancelMove }[a]; if (f) f(); return; }
  const f = { left: () => mv(-1, 0), right: () => mv(1, 0), up: () => mv(0, -1), down: () => mv(0, 1), ok, back, menu,
    guide: menu,                                              // Super key / Xbox button: open or close the side menu
    opts: () => { if (mode === 'home') appOptions(); } }[a];  // X / menu key: options for the selected app
  if (f) f();
}
LOS.onNav(nav, { guide: true });
addEventListener('focus', () => { backHome(); refreshTasks(); loadStoreApps(); loadApps(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) backHome(); });
$('#hx').onclick = () => { if (mode === 'home') appOptions(); };
// on-screen hints and the avatar go through the same handler as keys and buttons, so every mode handles them
$('#me').onclick = () => nav('menu'); $('#hm').onclick = () => nav('menu'); $('#hb').onclick = () => nav('back'); $('#ha').onclick = () => nav('ok'); $('#dim').onclick = () => nav('back');
$('#gtabs').onclick = e => { if (mode !== 'guide') return; const b = e.target.closest('.gt'); if (b) { g.t = +b.dataset.k; g.i = 0; rg(); } };
$('#gl').onclick = e => { if (mode !== 'guide') return; const b = e.target.closest('.it'); if (b) { g.i = +b.dataset.k; rg(); gact(); } };
function hoverRow(list, set) {
  list.addEventListener('mousemove', e => {
    const b = e.target.closest('[data-k]');
    if (!b || !LOS.mouseRecent() || b.classList.contains('f')) return;
    list.querySelectorAll('.f').forEach(x => x.classList.remove('f'));
    b.classList.add('f'); set(+b.dataset.k);
  });
}
hoverRow($('#gl'), k => { if (mode === 'guide') g.i = k; });
hoverRow($('#pl'), k => { if (mode === 'panel' && P) P.i = k; });
$('#pl').onclick = e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  P.i = +b.dataset.k;
  const o = P.rows[P.i];
  if (o.slider != null) {
    const r = b.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, Math.round((e.clientX - r.left) / r.width * 20) * 5));
    o.adjust((pct - o.slider) / 10);
    return;
  }
  rp(); pact();
};

/* ---------- start ---------- */
LOS.holdReady();   // (shown once the tiles are filled in, so they never jump around)
renderHome();
Promise.all([loadApps(), loadStoreApps(), refreshTasks()]).then(LOS.ready, LOS.ready);
tick(); setInterval(tick, 10000);
refreshNet(); setInterval(refreshNet, 15000);
refreshAll();
if (!LOS.prefs.setupDone) setTimeout(() => toast('New here? Start with Setup', 3800), 2400);
else setTimeout(() => toast('Press M or the menu button for the side menu', 3400), 2400);
