<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="stylesheet" href="los.css">
<style>
#head { position: absolute; left: 56px; right: 48px; top: 26px; height: 40px; display: flex; align-items: center; gap: 18px; }
#head h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
#note { font-size: 14px; color: var(--ink-2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#jobchip { display: none; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; font-size: 14px; }
#jobchip.on { display: flex; }
#jobchip .meter { width: 90px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
#jobchip .meter i { display: block; height: 100%; background: var(--accent); }

#side { position: absolute; left: 40px; top: 84px; width: 304px; bottom: 64px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 6px 8px; }
#side::-webkit-scrollbar { display: none; }
#side h3 { margin: 10px 4px 8px; font-size: 13px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
#side .it { padding: 9px 12px; margin-bottom: 6px; gap: 12px; }
#side .it .glyph { width: 34px; height: 34px; }
#side .it .txt span { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#side .it.cur:not(.f) { border-color: rgba(var(--accent-glow), .45); }
.dm { height: 4px; border-radius: 2px; background: var(--chip); margin-top: 6px; overflow: hidden; }
.dm i { display: block; height: 100%; background: var(--b); }
.dm i.warn { background: #e6c75a; } .dm i.crit { background: #e66767; }

#main { position: absolute; left: 364px; right: 40px; top: 84px; bottom: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
#crumb { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 15px; min-height: 50px; }
#crumb .c { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; cursor: pointer; }
#crumb .c:last-of-type { color: var(--ink); font-weight: 600; }
#crumb .sep { color: var(--mute); }
#crumb .free { margin-left: auto; color: var(--mute); font-size: 13px; white-space: nowrap; }
#cols { display: grid; grid-template-columns: 1fr 110px 150px; gap: 12px; padding: 8px 26px 6px 74px; font-size: 12px; color: var(--mute); font-weight: 600; }
#cols span:not(:first-child) { text-align: right; }
#list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 10px 10px; position: relative; scrollbar-width: thin; scrollbar-color: #2a4260 transparent; }
.fr { display: grid; grid-template-columns: 38px 1fr 110px 150px; gap: 12px; align-items: center; height: 46px; padding: 0 14px 0 10px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; font-size: 15px; }
.fr:hover { background: rgba(255, 255, 255, .03); }
.fr .ico { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--glyph); color: #cfe6ff; position: relative; }
.fr .ico .ic { width: 18px; height: 18px; }
.fr .ico.p { background: none !important; }
.fr .ico .pic { width: 32px; height: 32px; }
.fr .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr .sz, .fr .dt { text-align: right; color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fr.f { border-color: var(--accent); background: rgba(var(--accent-glow), .07); box-shadow: 0 0 0 4px rgba(var(--accent-glow), .08); }
.fr.sel { background: rgba(95, 184, 255, .13); }
.fr.sel .ico::after { content: "✓"; position: absolute; right: -5px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--b); color: #0b1726; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.fr.cutting { opacity: .5; }
.k-folder { background: #3a5a2a !important; color: #e6f5c8 !important; }
.k-image { background: #2c4c74 !important; } .k-video { background: #5a2f6e !important; } .k-audio { background: #6e4a1f !important; }
.k-program { background: #2b5797 !important; } .k-archive { background: #5c4a33 !important; } .k-doc { background: #7a2e2e !important; }
#empty { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 40px)); box-sizing: border-box; padding: 20px 18px; border: 1px solid transparent; border-radius: 14px; text-align: center; color: var(--mute); font-size: 16px; line-height: 1.6; display: none; }
#empty b { display: block; color: var(--ink-2); font-size: 18px; font-weight: 600; margin-bottom: 4px; }
/* an empty folder that has the focus (B goes back, X has New folder and Paste here) */
#empty.f { border-color: var(--accent); background: rgba(var(--accent-glow), .07); box-shadow: 0 0 0 4px rgba(var(--accent-glow), .08); }
#main.focus { border-color: #2f4a68; }

#clip { position: absolute; left: 56px; bottom: 18px; font-size: 14px; color: var(--ink-2); display: none; align-items: center; gap: 10px; max-width: 640px; }
#clip.on { display: flex; }
#clip b { color: var(--ink); font-weight: 600; }
#clip button { background: var(--chip); border-radius: 14px; padding: 4px 12px; font-size: 13px; }
#hints { position: absolute; right: 44px; bottom: 16px; }
#hints button[hidden] { display: none; }

label.pw { display: flex; gap: 8px; margin-bottom: 14px; }
label.pw input { flex: 1; font-size: 17px; padding: 11px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); outline: none; }
label.pw input:focus { border-color: var(--accent); }
.meterbar { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; margin: 6px 0 10px; }
.meterbar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .4s; }
.pnote { font-size: 14px !important; color: var(--ink-2); margin: 0 0 14px !important; overflow-wrap: anywhere; }
#pl { position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 6px 8px; margin: -6px -8px; flex: 1; min-height: 0; }
#pl::-webkit-scrollbar { display: none; }
.panel { width: 500px; max-height: 650px; display: flex; flex-direction: column; }
.panel h2, .panel p, #pbody { flex: none; }
.warnbox { background: rgba(224, 68, 62, .12); border: 1px solid rgba(224, 68, 62, .45); border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #ffd7d5; margin-bottom: 14px; line-height: 1.45; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<div id="head"><h1>Files</h1><span id="note"></span><button id="jobchip"><span id="jobtxt"></span><span class="meter"><i id="jobbar"></i></span></button></div>
<nav id="side" aria-label="Places and drives"></nav>
<section id="main" aria-label="Folder">
  <div id="crumb"></div>
  <div id="cols"><span>Name</span><span>Size</span><span>Changed</span></div>
  <div id="list" role="listbox" aria-multiselectable="true"></div>
  <div id="empty"></div>
</section>
<div id="clip"><span id="cliptxt"></span><button id="clippaste">Paste here</button><button id="clipclear">Clear</button></div>
<div id="hints" class="hints">
  <button id="ha"><u style="background:#3ddc6b">A</u><span id="hat">Open</span></button>
  <button id="hb"><u style="background:#e0443e">B</u><span id="hbt">Back</span></button>
  <button id="hx"><u style="background:#5fb8ff">X</u>Options</button>
  <button id="hm"><u style="background:#cfe6ff">&#8801;</u>Home</button>
</div>
<div class="dim" id="dim"></div>
<section class="panel" id="panel" aria-live="polite"><h2 id="ph"></h2><p id="pp"></p><div id="pbody"></div><div id="pl"></div></section>
<div id="toast"></div>
</div></div>
<script src="los.js"></script>
<script>
const { $, call, toast, icon, pic, esc } = LOS;
/* full-color icons for each kind of file */
const PICS = { folder: 'folder', image: 'file-image', video: 'file-video', audio: 'file-audio', program: 'file-program', archive: 'file-archive', doc: 'file-doc', text: 'file-text', web: 'browser', other: 'file-other' };

/* ---------- state ---------- */
let places = [], drives = [], sideRows = [], si = 0;      // left column
let cur = null, entries = [], li = 0;                     // the open folder
let focus = 'side', mode = 'browse';                      // focus: side | list; mode: browse | select | panel
const sel = new Set();                                    // selected names in the open folder
let clip = null;                                          // { op: 'copy'|'move', paths: [], from }
let rootOf = '';                                          // the place or drive the open folder is in
let saving = true, lastPlaces = null;
const memory = {};                                        // folder -> focused name, to come back to the same spot

const ICONS = { folder: 'folder', image: 'image', video: 'film', audio: 'music', program: 'grid', archive: 'archive', doc: 'doc', text: 'text', web: 'globe', other: 'file' };
const KIND_NAMES = { folder: 'Folder', image: 'Picture', video: 'Video', audio: 'Music or sound', program: 'Windows program', archive: 'Archive', doc: 'PDF document', text: 'Text', web: 'Web page', other: 'File' };
function size(n) {
  if (n == null) return '';
  const u = ['bytes', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n >= 100 ? Math.round(n) : n.toFixed(1).replace(/\.0$/, '')) + ' ' + u[i];
}
const gb = n => size(n);
function when(t) {
  const d = new Date(t * 1000), now = new Date();
  const same = d.toDateString() === now.toDateString();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  const tm = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  if (same) return 'Today ' + tm;
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
const pjoin = (a, b) => a.replace(/\/$/, '') + '/' + b;
const baseName = p => p.slice(p.lastIndexOf('/') + 1);
const dirName = p => p.slice(0, p.lastIndexOf('/')) || '/';
const fileUrl = p => 'file://' + p.split('/').map(encodeURIComponent).join('/');
const level = v => v >= 90 ? 'crit' : v >= 75 ? 'warn' : '';

/* ---------- remembered between visits (Home, the viewer) ---------- */
function saveState() {
  try { sessionStorage.setItem('launchos.files', JSON.stringify({ path: cur && cur.path, root: rootOf, focus, name: (entries[li] || {}).name, clip })); } catch (e) { /* no storage */ }
}
function loadState() { try { return JSON.parse(sessionStorage.getItem('launchos.files') || 'null'); } catch (e) { return null; } }

/* ---------- left column: places and drives ---------- */
async function loadPlaces() {
  const r = await call('fs_places');
  if (!r || r.error || !r.places) return false;
  const sig = JSON.stringify([r.places, r.drives.map(d => [d.id, d.mount, d.name, d.empty, Math.round((d.free || 0) / 1e7)])]);
  places = r.places; drives = r.drives; saving = r.saving;
  if (r.job && r.job.op && !r.job.done) watchJob(false);
  if (sig !== lastPlaces) { lastPlaces = sig; renderSide(); }
  return true;
}
function driveSub(d) {
  if (d.empty) return 'Empty · format it to use it';
  if (!d.dev) return 'Can’t be read · format it to use it';
  if (d.mount) return gb(d.free) + ' free of ' + gb(d.total) + (d.readonly ? ' · read-only' : '');
  if (d.ejected) return 'Safe to unplug · select to open again';
  return (d.removable ? 'USB drive' : 'Inside this PC') + ' · ' + gb(d.size);
}
function renderSide() {
  // the selection stays on the same place or drive (by what it is, not by its row number: a drive
  // that went away mustn't leave it on whatever moved up into its row)
  const ident = r => !r ? '' : r.kind === 'place' ? 'p:' + r.p.id : 'd:' + (r.d.dev || r.d.mount || r.d.name);
  const was = ident(sideRows[si]);
  sideRows = [];
  let h = '<h3>Your folders</h3>';
  places.forEach(p => { sideRows.push({ kind: 'place', p }); h += sideRow(sideRows.length - 1, '@folder-' + p.id.replace('downloads', 'download'), p.name, p.id === 'downloads' ? 'Browser downloads go here' : ''); });
  h += '<h3>Drives</h3>';
  drives.forEach(d => {
    sideRows.push({ kind: 'drive', d });
    const pct = d.total ? 100 * (1 - d.free / d.total) : 0;
    h += sideRow(sideRows.length - 1, d.removable ? '@drive' : '@saving', d.name, driveSub(d), d.mount ? `<div class="dm"><i class="${level(pct)}" style="width:${pct.toFixed(1)}%"></i></div>` : '');
  });
  if (!drives.length) h += '<div style="color:var(--mute);font-size:14px;padding:4px 6px 0">Plug in a USB drive and it shows up here.</div>';
  $('#side').innerHTML = h;
  let k = sideRows.findIndex(r => ident(r) === was);
  if (k < 0) k = sideRows.findIndex(r => sideRoot(r) && sideRoot(r) === rootOf);   // gone: the open folder's place
  si = Math.max(0, Math.min(k < 0 ? 0 : k, sideRows.length - 1));
  paintSide();
}
// g: a glyph name, or "@name" for a full-color icon
const sideRow = (k, g, t, s, extra) => `<div class="it" data-k="${k}"><span class="glyph${g[0] === '@' ? ' p' : ''}">${g[0] === '@' ? pic(g.slice(1)) : icon(g)}</span><span class="txt"><span>${esc(t)}</span>${s ? `<small>${esc(s)}</small>` : ''}${extra || ''}</span></div>`;
function sideRoot(row) { return row.kind === 'place' ? row.p.path : row.d.mount; }
function paintSide() {
  document.querySelectorAll('#side .it').forEach(el => {
    const k = +el.dataset.k, row = sideRows[k];
    el.classList.toggle('f', focus === 'side' && mode !== 'panel' && k === si);
    el.classList.toggle('cur', !!row && !!rootOf && sideRoot(row) === rootOf);
  });
  keepVisible($('#side'), $('#side .it.f'));
  hints();
}
async function openSide(k, toList) {
  const row = sideRows[k]; if (!row) return;
  si = k;
  if (row.kind === 'place') { await openFolder(row.p.path, row.p.path); if (toList) setFocus('list'); return; }
  const d = row.d;
  if (d.mount) { await openFolder(d.mount, d.mount); if (toList) setFocus('list'); return; }
  if (!d.dev) { driveOptions(d); return; }
  toast('Opening ' + d.name + '…');
  const r = await call('fs_mount', d.dev);
  if (r && r.ok) { await loadPlaces(); await openFolder(r.mount, r.mount); si = sideRows.findIndex(x => x.kind === 'drive' && x.d.dev === d.dev); if (si < 0) si = 0; setFocus('list'); }
  else { toast((r && r.error) || 'Couldn’t open the drive', 4200); }
}

/* ---------- the open folder ---------- */
let listSeq = 0;
async function openFolder(path, root, keepName, quiet) {
  const my = ++listSeq;
  const r = await call('fs_list', path);
  if (my !== listSeq) return false;   // a newer folder was asked for meanwhile
  if (!r || r.error) {
    if (!quiet) toast((r && r.error) || 'Couldn’t open that folder', 4000);
    if (cur && path === cur.path) { await loadPlaces(); goPlace(0); }   // the folder (or its drive) went away
    return false;
  }
  const changed = !cur || cur.path !== r.path;
  if (cur && changed) memory[cur.path] = (entries[li] || {}).name;
  cur = r; entries = r.entries; rootOf = root || rootOf;
  if (changed) { sel.clear(); if (mode === 'select') mode = 'browse'; $('#list').scrollTop = 0; }
  const want = keepName != null ? keepName : changed ? memory[r.path] : (entries[li] || {}).name;
  li = Math.max(0, entries.findIndex(e => e.name === want));
  for (const n of [...sel]) if (!entries.some(e => e.name === n)) sel.delete(n);
  renderList(); renderCrumb(); paintSide(); saveState();
  if (focus === 'list') showRow();
  return true;
}
function goPlace(k) { si = k; const row = sideRows[k]; if (row) openFolder(sideRoot(row) || places[0].path, sideRoot(row) || places[0].path); }
const refresh = () => cur ? openFolder(cur.path, rootOf) : null;
function renderCrumb() {
  if (!cur) return;
  const rel = cur.path.slice(rootOf.length).split('/').filter(Boolean);
  const top = sideRows.find(r => sideRoot(r) === rootOf);
  const label = top ? (top.kind === 'place' ? top.p.name : top.d.name) : 'Folder';
  const parts = [[label, rootOf]];
  rel.forEach((p, i) => parts.push([p, rootOf + '/' + rel.slice(0, i + 1).join('/')]));
  const shown = parts.length > 4 ? [parts[0], ['…', null], ...parts.slice(-2)] : parts;
  $('#crumb').innerHTML = shown.map((p, i) => (i ? '<span class="sep">›</span>' : '') + `<span class="c" data-p="${p[1] == null ? '' : esc(p[1])}">${esc(p[0])}</span>`).join('')
    + `<span class="free">${cur.readonly ? 'Read-only · ' : ''}${gb(cur.free)} free</span>`;
  const n = entries.length;
  $('#note').textContent = !saving && cur.path.startsWith('/home/') ? 'Saving is off: your folders are cleared at shut down. Copy files to a drive to keep them.'
    : n + (n === 1 ? ' item' : ' items') + (cur.truncated ? ' (showing the first 5,000)' : '');
}
/* The list is drawn in slices, so a folder with thousands of files stays quick. */
const ROW = 46, BUF = 20;
function renderList() {
  const L = $('#list');
  $('#empty').style.display = entries.length ? 'none' : 'block';
  $('#empty').innerHTML = cur && cur.writable ? '<b>This folder is empty</b>' + (clip ? 'Press X for Paste here.' : 'Copy files here from another folder or drive.') : '<b>Nothing here</b>';
  L.innerHTML = `<div id="spacer" style="height:${entries.length * ROW}px;position:relative"></div>`;
  L._from = -1;
  drawRows(true);
}
function drawRows(force) {
  const L = $('#list'), sp = $('#spacer'); if (!sp) return;
  const from = Math.max(0, Math.floor(L.scrollTop / ROW) - BUF), to = Math.min(entries.length, Math.ceil((L.scrollTop + L.clientHeight) / ROW) + BUF);
  if (!force && from === L._from && to === L._to) { paintList(); return; }
  L._from = from; L._to = to;
  const cutting = clip && clip.op === 'move' ? new Set(clip.paths) : null;
  let h = '';
  for (let k = from; k < to; k++) {
    const e = entries[k];
    const cls = ['fr', e.dir ? 'dir' : '', sel.has(e.name) ? 'sel' : '', cutting && cutting.has(pjoin(cur.path, e.name)) ? 'cutting' : ''].join(' ');
    h += `<div class="${cls}" data-k="${k}" role="option" style="position:absolute;left:0;right:0;top:${k * ROW}px"><span class="ico p">${pic(PICS[e.kind] || 'file-other')}</span><span class="nm">${esc(e.name)}</span><span class="sz">${e.dir ? '' : size(e.size)}</span><span class="dt">${when(e.mtime)}</span></div>`;
  }
  sp.innerHTML = h;
  paintList();
}
function paintList() {
  document.querySelectorAll('#list .fr').forEach(el => {
    const k = +el.dataset.k, e = entries[k];
    el.classList.toggle('f', focus === 'list' && mode !== 'panel' && k === li);
    el.classList.toggle('sel', !!e && sel.has(e.name));
  });
  $('#main').classList.toggle('focus', focus === 'list');
  $('#empty').classList.toggle('f', focus === 'list' && mode !== 'panel' && !entries.length);
  hints();
}
function showRow() {
  const L = $('#list'), top = li * ROW, pad = 8;
  if (top - pad < L.scrollTop) L.scrollTop = Math.max(0, top - pad);
  else if (top + ROW + pad > L.scrollTop + L.clientHeight) L.scrollTop = top + ROW + pad - L.clientHeight;
  drawRows();
}
$('#list').addEventListener('scroll', () => drawRows());
function setFocus(f) { focus = f; if (f === 'list' && !entries.length) focus = cur ? 'list' : 'side'; paintSide(); paintList(); if (focus === 'list') showRow(); saveState(); }
function keepVisible(box, el) {
  if (!el) return;
  const pad = 8;
  if (el.offsetTop - pad < box.scrollTop) box.scrollTop = el.offsetTop - pad;
  else if (el.offsetTop + el.offsetHeight + pad > box.scrollTop + box.clientHeight) box.scrollTop = el.offsetTop + el.offsetHeight + pad - box.clientHeight;
}
function hints() {
  const sel0 = mode === 'select';
  $('#hat').textContent = sel0 ? 'Select' : 'Open';
  // an empty folder has nothing to open: no A hint (B goes back, X pastes)
  $('#hat').parentElement.style.visibility = focus === 'list' && !entries.length && !sel0 ? 'hidden' : '';
  $('#hbt').textContent = sel0 ? 'Done selecting' : focus === 'side' ? 'Home' : (cur && cur.path !== rootOf ? 'Up' : 'Back');
  $('#hx').hidden = false;
  const c = $('#clip');
  c.classList.toggle('on', !!clip || sel.size > 0);
  $('#cliptxt').innerHTML = clip ? `<b>${clip.paths.length} item${clip.paths.length === 1 ? '' : 's'}</b> ready to ${clip.op === 'copy' ? 'copy' : 'move'}. Go to a folder, then Paste here.`
    : sel.size ? `<b>${sel.size} selected</b>` + (mode === 'select' ? ' · A to select more, X for options' : '') : '';
  $('#clippaste').style.display = clip ? '' : 'none';
  $('#clipclear').textContent = clip ? 'Clear' : 'Unselect';
}

/* ---------- what's selected ---------- */
function targets() {
  if (sel.size) return entries.filter(e => sel.has(e.name));
  return entries[li] ? [entries[li]] : [];
}
function toggleSel(k) {
  const e = entries[k]; if (!e) return;
  if (sel.has(e.name)) sel.delete(e.name); else sel.add(e.name);
  paintList();
}
function setClip(op) {
  const t = targets(); if (!t.length) return;
  clip = { op, paths: t.map(e => pjoin(cur.path, e.name)), from: cur.path };
  sel.clear(); if (mode === 'select') mode = 'browse';
  drawRows(true); saveState();
  toast((op === 'copy' ? 'Copy ' : 'Move ') + (t.length === 1 ? t[0].name : t.length + ' items') + ': go to a folder or drive, then Paste here', 3600);
}

/* ---------- opening things ---------- */
async function openEntry(k) {
  const e = entries[k]; if (!e) return;
  const path = pjoin(cur.path, e.name);
  if (e.dir) { memory[cur.path] = e.name; await openFolder(path, rootOf, ''); if (focus !== 'list') setFocus('list'); return; }
  if (e.kind === 'image' || e.kind === 'video' || e.kind === 'audio' || (e.kind === 'text' && e.size <= 2 << 20)) {
    const same = entries.filter(x => !x.dir && x.kind === e.kind && (e.kind !== 'text' || x.size <= 2 << 20));

$('#list').addEventListener('contextmenu', e => {
  e.preventDefault();
  if (mode === 'panel') return;
  const el = e.target.closest('.fr');
  focus = 'list';
  if (el) { const k = +el.dataset.k; if (!sel.has(entries[k].name)) { sel.clear(); } li = k; }
  else sel.clear();
  paintList(); paintSide(); itemOptions();
});
$('#side').addEventListener('click', e => {
  if (mode === 'panel') return;
  const el = e.target.closest('.it'); if (!el) return;
  focus = 'side'; si = +el.dataset.k; paintSide(); openSide(si, false);
});
$('#side').addEventListener('contextmenu', e => {
  e.preventDefault(); if (mode === 'panel') return;
  const el = e.target.closest('.it'); if (!el) return;
  focus = 'side'; si = +el.dataset.k; paintSide(); itemOptions();
});
$('#side').addEventListener('mousemove', e => {
  if (mode === 'panel' || !LOS.mouseRecent()) return;
  const el = e.target.closest('.it'); if (!el) return;
  const k = +el.dataset.k; if (focus === 'side' && k === si) return;
  if (focus === 'side') { si = k; paintSide(); }
});
$('#crumb').addEventListener('click', e => { const c = e.target.closest('.c'); if (c && c.dataset.p && mode !== 'panel') openFolder(c.dataset.p, rootOf); });
$('#pl').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b || !P) return; P.i = +b.dataset.k; rp(); pact(); });
$('#pl').addEventListener('mousemove', e => { const b = e.target.closest('[data-k]'); if (!b || !P || !LOS.mouseRecent() || +b.dataset.k === P.i) return; P.i = +b.dataset.k; rp(); });
$('#dim').onclick = () => { if (mode === 'panel') nav('back'); };
$('#ha').onclick = () => nav('ok'); $('#hb').onclick = () => nav('back'); $('#hx').onclick = () => nav('opts'); $('#hm').onclick = home;
$('#jobchip').onclick = () => { if (mode !== 'panel') { jobShown = true; paintJob(null); } };
$('#clippaste').onclick = () => { if (mode !== 'panel') paste(); };
$('#clipclear').onclick = () => { if (clip) { clip = null; drawRows(true); saveState(); } else { sel.clear(); mode = 'browse'; paintList(); } };

/* ---------- start ---------- */
(async function start() {
  const st = loadState();
  if (st && st.clip) clip = st.clip;
  for (let i = 0; i < 20 && !(await loadPlaces()); i++) await new Promise(r => setTimeout(r, 1000));
  if (!places.length) { $('#empty').style.display = 'block'; $('#empty').innerHTML = '<b>Files couldn’t start</b>Go back to Home and try again.'; return; }
  let ok = false;
  if (st && st.path && st.root) {
    si = Math.max(0, sideRows.findIndex(r => sideRoot(r) === st.root));
    ok = await openFolder(st.path, st.root, st.name, true);
    if (ok && st.focus === 'list') setFocus('list');
  }
  if (!ok) { si = 0; await openFolder(places[0].path, places[0].path); setFocus('side'); }
  paintSide();
  // drives come and go: check every few seconds while Files is on screen
  let slowTick = 0;
  setInterval(async () => {
    if (document.hidden || (mode === 'panel' && P && P.busy)) return;   // ejecting or formatting: that pop-up handles it
    if (jobTimer && ++slowTick % 4) return;   // while copying, check less often: the copy gets the time
    const before = rootOf;
    await loadPlaces();
    if (before.startsWith('/media/') && !drives.some(d => d.mount === before)) {
      toast('The drive was removed', 3600);
      cur = null; rootOf = ''; goPlace(0); setFocus('side');   // a message about it (a copy that failed) stays up
    }
  }, 3000);
})();
</script>
