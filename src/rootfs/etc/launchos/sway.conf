# LaunchOS session. One app on screen at a time (any number running), full screen, no bars or borders,
# no desktop shortcuts: the Super key belongs to LaunchOS (Home and the side menu).
xwayland enable
default_border none
default_floating_border pixel 2
client.focused #3ddc6b #3ddc6b #0b1726 #3ddc6b #3ddc6b
focus_follows_mouse no
mouse_warping none
# an app in the background (on a screen that isn't shown) can't jump in front by asking; LaunchOS
# brings apps to the front itself
focus_on_window_activation smart
popup_during_fullscreen smart
output * bg #0b1726 solid_color
# Every app has a screen (workspace) of its own and LaunchOS switches between them: Home is on
# "1", web apps and the Terminal on "w-<app>", Files, Settings, the Store, the system monitor and
# Setup on "p-<page>", and every other app (games, Steam, Discord, Firefox, Windows programs) on
# "x-<app>". Their windows first land on "app", out of sight, and LaunchOS moves each to its
# app's screen. Nothing is hidden, reloaded or redrawn to switch, so nothing flickers.
for_window [shell="xwayland"] move container to workspace app
for_window [shell="xdg_shell" app_id="^(?!os\.launch\.home$)"] move container to workspace app
# LaunchOS's own apps open on their screens out of sight, and come in front once they're drawn
assign [app_id="^os\.launch\.home$" title="^LaunchOS Files$"] workspace p-files
assign [app_id="^os\.launch\.home$" title="^LaunchOS Settings$"] workspace p-settings
assign [app_id="^os\.launch\.home$" title="^LaunchOS Store$"] workspace p-store
assign [app_id="^os\.launch\.home$" title="^LaunchOS System monitor$"] workspace p-monitor
assign [app_id="^os\.launch\.home$" title="^LaunchOS Setup$"] workspace p-setup
# apps and games fill their screen; dialogs float on top. Firefox fills its screen without going
# full screen (that would hide its address bar and tabs, like pressing F11).
for_window [tiling shell="xwayland"] fullscreen enable
for_window [tiling shell="xdg_shell" app_id="^(?!firefox)"] fullscreen enable
input type:touchpad {
    tap enabled
    natural_scroll enabled
}
exec /usr/bin/dbus-run-session /usr/local/bin/launchos-inner
