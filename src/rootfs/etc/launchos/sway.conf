# LaunchOS session. One app on screen at a time, full screen, no bars or borders,
# no desktop shortcuts: the Super key belongs to LaunchOS (Home and the side menu).
xwayland enable
default_border none
default_floating_border pixel 2
client.focused #3ddc6b #3ddc6b #0b1726 #3ddc6b #3ddc6b
focus_follows_mouse no
mouse_warping none
focus_on_window_activation focus
popup_during_fullscreen smart
output * bg #0b1726 solid_color
# apps and games fill the screen; dialogs float on top
for_window [tiling] fullscreen enable
input type:touchpad {
    tap enabled
    natural_scroll enabled
}
exec /usr/bin/dbus-run-session /usr/local/bin/launchos-inner
