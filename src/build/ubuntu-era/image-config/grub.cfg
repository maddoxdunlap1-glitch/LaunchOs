set timeout=0
set default=0

# LaunchOS is 64-bit. On a 32-bit virtual machine, explain the fix instead of stopping silently.
if [ "$grub_platform" = "pc" ]; then
  insmod cpuid
  insmod sleep
  insmod halt
  if ! cpuid -l; then
    echo ""
    echo "  LaunchOS needs a 64-bit virtual machine."
    echo ""
    echo "  This VM is set up as 32-bit, so LaunchOS can't start."
    echo "  In VirtualBox, power off the VM and open Settings:"
    echo "    General:  Type = Linux, Version = Ubuntu (64-bit)"
    echo "    System:   Base Memory = 2048 MB or more"
    echo ""
    echo "  Or add the ready-made LaunchOS.vbox with Machine > Add."
    echo ""
    sleep -i 99999
    halt
  fi
fi

menuentry "LaunchOS" {
  linux /casper/vmlinuz boot=casper persistent quiet splash loglevel=0 rd.systemd.show_status=false systemd.show_status=false udev.log_level=3 vt.global_cursor_default=0 nowatchdog noprompt username=player hostname=launchos
  initrd /casper/initrd
}
