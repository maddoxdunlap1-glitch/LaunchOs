name: Publish LaunchOS release

on:
  push:
    branches: [main]
    paths: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all parts are here
        id: check
        run: |
          expected=$(cat dist/PARTS)
          found=$(ls dist/LaunchOS.zip.part* | wc -l)
          echo "expected=$expected found=$found"
          if [ "$found" = "$expected" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: Join and verify LaunchOS.zip
        if: steps.check.outputs.ready == 'yes'
        run: |
          cat $(ls dist/LaunchOS.zip.part* | sort) > LaunchOS.zip
          echo "$(cat dist/SHA256)  LaunchOS.zip" | sha256sum -c -
          ls -lh LaunchOS.zip
      - name: Publish release
        if: steps.check.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(cat dist/VERSION)"
          # the small update package (Settings > Updates on LaunchOS downloads it)
          extra=""
          [ -f dist/update/launchos-update.json ] && extra="dist/update/launchos-update.tar.gz dist/update/launchos-update.json"
          gh release delete "$v" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$v" LaunchOS.zip $extra \
            --title "LaunchOS $v" \
            --notes-file dist/NOTES.md
          # Keep only the newest build (removed after the new one is up, so updates never find nothing)
          for t in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            [ "$t" = "$v" ] || gh release delete "$t" --yes --cleanup-tag || true
          done
